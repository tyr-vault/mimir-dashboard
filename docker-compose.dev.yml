# Dev overlay — hot reload via bind mounts + persisted node_modules volume.
services:
  dashboard:
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - dashboard_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: 'true'
      NUXT_MIMIR_API_BASE_URL: http://host.docker.internal:${API_PORT:-5000}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3000}
    command: pnpm dev --host 0.0.0.0 --port 3000
    restart: 'no'

volumes:
  dashboard_node_modules:
